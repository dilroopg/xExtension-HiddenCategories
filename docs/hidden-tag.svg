<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 40" width="210" height="40">
  <!-- Mirrors the real rule in static/hidden.css:
       content:"hidden" uppercased by text-transform, font-size 0.62em of the ~15px
       sidebar title, letter-spacing 0.05em, opacity 0.7, margin-left 0.45em,
       padding 0 0.3em, border 1px solid currentColor, border-radius 3px,
       background transparent. -->
  <rect width="210" height="40" fill="#222"/>
  <text x="10" y="26" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="15" fill="#ddd">Comics</text>
  <g opacity="0.7">
    <rect x="76" y="13" width="52" height="15" rx="3" ry="3"
          fill="none" stroke="#ddd" stroke-width="1"/>
    <text x="80.5" y="24.2" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="9.3" letter-spacing="0.47" fill="#ddd">HIDDEN</text>
  </g>
</svg>
